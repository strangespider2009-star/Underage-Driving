# Render Blueprint for Underage-Driving ESP32 LED + buzzer demo.
# Deploy as a single Web Service so the React site and /api share one origin.
services:
  - type: web
    name: underage-driving
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
